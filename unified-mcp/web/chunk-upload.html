<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Subir imagen por fragmentos</title>
<style>body{font:16px system-ui;margin:0;padding:20px;color:#172b3a;background:#f6f8fa}main{max-width:560px;margin:auto}button,input{font:inherit;max-width:100%;margin:10px 0}button{padding:12px 20px;border:0;border-radius:8px;background:#146c64;color:white}button:disabled{opacity:.5}progress{width:100%}p{overflow-wrap:anywhere}a{color:#07675d}#error{color:#a12222}</style>
<main><h2>Subir imagen por fragmentos</h2><p>Elige una imagen del móvil. Se enviará en partes de 32 KB y se verificará antes de generar el enlace. Esto no publica noticias.</p>
<label for="image">Imagen JPEG, PNG o WebP (máximo 12 MB)</label><br><input id="image" type="file" accept="image/jpeg,image/png,image/webp">
<br><button id="upload" disabled>Subir por fragmentos</button><progress id="progress" value="0" max="1"></progress>
<p id="status" role="status" aria-live="polite">Conectando con el complemento…</p><p id="error" role="alert"></p><p id="result"></p></main>
<script>
"use strict";
const pending = new Map(); let nextId = 0; let connected = false; let staged = null;
function request(method, params) {
  return new Promise((resolve, reject) => {
    const id = ++nextId;
    const timer = setTimeout(() => { pending.delete(id); reject(new Error("La conexión no respondió. Puedes reintentar.")); }, 60000);
    pending.set(id, {resolve, reject, timer});
    window.parent.postMessage({jsonrpc:"2.0", id, method, params}, "*");
  });
}
window.addEventListener("message", event => {
  if (event.source !== window.parent || event.data?.jsonrpc !== "2.0") return;
  const entry = pending.get(event.data.id); if (!entry) return;
  clearTimeout(entry.timer); pending.delete(event.data.id);
  if (event.data.error) entry.reject(new Error(event.data.error.message || "El complemento rechazó la operación."));
  else entry.resolve(event.data.result);
});
async function call(name, args) {
  const response = await request("tools/call", {name, arguments:args});
  const value = response.structuredContent ?? JSON.parse(response.content?.find(x => x.type === "text")?.text || "{}");
  if (response.isError || !value.success) throw new Error(value.error || "No se pudo completar la subida.");
  return value.data;
}
const input = document.getElementById("image"), button = document.getElementById("upload"), status = document.getElementById("status"), progress = document.getElementById("progress"), error = document.getElementById("error"), result = document.getElementById("result");
input.onchange = () => {staged = null; button.disabled = !connected || !input.files.length; result.replaceChildren(); error.textContent = "";};
async function uploadFile(file, callTool, onProgress, resume) {
  if (!file || !["image/jpeg","image/png","image/webp"].includes(file.type)) throw new Error("Selecciona una imagen JPEG, PNG o WebP.");
  if (!file.size || file.size > 12 * 1024 * 1024) throw new Error("La imagen debe ocupar entre 1 byte y 12 MB.");
  const digest = Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256", await file.arrayBuffer())), x => x.toString(16).padStart(2,"0")).join("");
  const chunkSize = 32768, total = Math.ceil(file.size / chunkSize);
  const state = resume?.hash === digest ? resume : {hash:digest, upload_id:(await callTool("start_temp_image_upload", {})).upload_id, next:0};
  staged = state;
  for (let i = state.next; i < total; i++) {
    const bytes = new Uint8Array(await file.slice(i * chunkSize, (i + 1) * chunkSize).arrayBuffer());
    let binary = ""; for (const byte of bytes) binary += String.fromCharCode(byte);
    const ack = await callTool("upload_temp_image_chunk", {upload_id:state.upload_id, chunk_index:i, chunk_base64:btoa(binary)});
    if (ack.chunk_index !== i || ack.bytes !== bytes.length) throw new Error("El servidor no confirmó correctamente el fragmento.");
    state.next = i + 1; onProgress(state.next, total);
  }
  const completed = await callTool("finish_temp_image_upload", {upload_id:state.upload_id, total_chunks:total, mime_type:file.type, filename:file.name, ttl_seconds:900, auto_optimize:false, expected_sha256:digest});
  if (completed.sha256 !== digest || completed.size_bytes !== file.size) throw new Error("La integridad del archivo final no coincide con el original.");
  const url = new URL(completed.public_url || completed.signed_url); if (url.protocol !== "https:") throw new Error("El servidor no devolvió un enlace HTTPS.");
  return completed;
}
button.onclick = async () => {
  button.disabled = true; input.disabled = true; error.textContent = ""; result.replaceChildren();
  try {
    status.textContent = "Comprobando imagen…";
    const completed = await uploadFile(input.files[0], call, (done,total) => {progress.max = total; progress.value = done; status.textContent = `Fragmentos confirmados: ${done} de ${total}`;}, staged);
    staged = null; status.textContent = `Subida verificada: ${completed.size_bytes} bytes. El enlace caduca en 15 minutos.`;
    const link = document.createElement("a"); link.href = completed.public_url || completed.signed_url; link.textContent = "Abrir imagen subida"; link.target = "_blank"; link.rel = "noopener noreferrer"; result.append(link, document.createElement("br"), document.createTextNode(link.href));
    request("ui/update-model-context", {structuredContent:{image_upload:completed}}).catch(() => {});
    button.textContent = "Subir otra vez";
  } catch (e) {error.textContent = e.message; status.textContent = "Subida sin completar. Puedes reintentar desde el último fragmento confirmado."; button.textContent = "Reintentar subida";}
  finally {button.disabled = false; input.disabled = false;}
};
request("ui/initialize", {appInfo:{name:"Social-Mcps-Cloud image uploader",version:"1.0.0"},appCapabilities:{},protocolVersion:"2026-01-26"}).then(() => {
  window.parent.postMessage({jsonrpc:"2.0",method:"ui/notifications/initialized",params:{}}, "*");
  connected = true; status.textContent = "Elige la imagen y pulsa Subir por fragmentos."; button.disabled = !input.files.length;
}).catch(() => {status.textContent = "Este cliente no permite abrir el cargador. Abre el chat en el navegador del móvil y vuelve a pedirlo.";});
</script></html>
